baseURL = 'https://marksuth.dev/'
languageCode = 'en-gb'
title = 'Mark Sutherland'
theme = 'marksuth'
disableKinds = ["taxonomy", "term"]

[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menus.main]]
    name = "Now"
    url = "/now"
    weight = 20
[[menus.footer]]
name = "Privacy Policy"
url = "/privacy"
weight = 10


[params]
  description = 'Personal website of Mark Sutherland'
  favicon = 'favicon.svg'
  logo = 'images/logo.svg'
  social_links = [
    { name = "GitHub", url = "https://github.com/marksuth", rel = "me" },
    { name = "LinkedIn", url = "https://www.linkedin.com/in/marksuth", rel = "me" }
  ]
  email = "mark@marksuth.dev"
  webmention = "https://webmention.io/marksuth.dev/webmention"
  pingback = "https://webmention.io/marksuth.dev/xmlrpc"
  authorization_endpoint = "https://indieauth.com/auth"
  token_endpoint = "https://tokens.indieauth.com/token"
  microsub = "https://aperture.p3k.io/microsub/658"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'

[caches]
  [caches.images]
    dir = ':cacheDir/images'